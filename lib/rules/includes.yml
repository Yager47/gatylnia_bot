# Replies to a message that contains one of these, checked top to bottom: the
# first rule that matches wins, so a longer phrase must come before any
# shorter one it contains (a spec checks this). Used by Response::Includes.
#
# Match with one of:
#   contains: a string or a list of strings, anywhere in the downcased text
#   phrases:  any phrase from lib/phrases/<name>.yml, anywhere in the text
#   pattern:  a regular expression, e.g. '\bслово\b' for a whole word
# Then reply with one of:
#   reply:    a string, or a list to pick one from at random
#   answers:  a list from lib/answers/<name>.yml
#   render:   lib/answers/<name>.yml.erb, rendered with the author's first_name
#   stop:     true - don't reply, and don't let later rules or responders reply
#
# "f[f[" is "ахах" typed on an English keyboard layout.
