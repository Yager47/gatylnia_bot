production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_telegram_updates:
    class: CleanupTelegramUpdatesJob
    schedule: every day at 4am
  # Fugit reads times as UTC (the dyno's clock) unless a zone is given.
  camerton_reminders:
    class: CamertonRemindersJob
    schedule: every day at 9am Europe/Kyiv
  # Camerton achievements decided when a week or month ends.
  close_weekly_achievements:
    class: CloseAchievementPeriodsJob
    args: [ "week" ]
    schedule: "0 9 * * 1 Europe/Kyiv"
  close_monthly_achievements:
    class: CloseAchievementPeriodsJob
    args: [ "month" ]
    schedule: "0 9 1 * * Europe/Kyiv"
