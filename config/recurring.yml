# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_telegram_updates:
    class: CleanupTelegramUpdatesJob
    schedule: every day at 4am
  # Fugit reads times as UTC (the dyno's clock) unless a zone is given.
  camerton_reminders:
    class: CamertonRemindersJob
    schedule: every day at 9am Europe/Kyiv
  # Camerton achievements: a daily re-check (a Серія ends after a day
  # without reviews), and the ones decided when a release turns a week old
  # or a week or month ends.
  check_achievements:
    class: CheckAllAchievementsJob
    schedule: "0 9 * * * Europe/Kyiv"
  close_release_achievements:
    class: CloseAchievementPeriodsJob
    args: [ "release" ]
    schedule: "0 9 * * * Europe/Kyiv"
  close_weekly_achievements:
    class: CloseAchievementPeriodsJob
    args: [ "week" ]
    schedule: "0 9 * * 1 Europe/Kyiv"
  close_monthly_achievements:
    class: CloseAchievementPeriodsJob
    args: [ "month" ]
    schedule: "0 9 1 * * Europe/Kyiv"
